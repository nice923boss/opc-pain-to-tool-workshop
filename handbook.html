<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0c10">
<title>學員提示詞手冊｜OPC 一人公司 AI 實戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#0d0c10;--card:#17151c;--line:#2c2833;--ink:#f1ece6;--ink2:#cfc6bc;--dim:#978d84;
  --acc:#ffb86b;--hl:rgba(255,184,107,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);min-height:100vh;
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;font-size:16px;line-height:1.7;
  background-image:radial-gradient(120% 60% at 100% 0%,var(--hl),transparent 60%);
  background-attachment:fixed;transition:background-color .3s;
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* ---------- intro ---------- */
.top{padding-top:calc(28px + env(safe-area-inset-top));padding-bottom:18px}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--dim)}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(28px,7vw,40px);line-height:1.25;margin:8px 0 18px}
h1 em{font-style:normal;color:var(--acc)}
.how{list-style:none;display:grid;gap:8px;counter-reset:s}
.how li{counter-increment:s;display:flex;gap:12px;align-items:baseline;color:var(--ink2);font-size:15px}
.how li::before{
  content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:600;color:var(--bg);background:var(--acc);
}
.how b{color:var(--ink)}
.ph{color:var(--acc);background:var(--hl);border-radius:4px;padding:0 3px;font-weight:700}

/* ---------- tabs ---------- */
.tabs{
  position:sticky;top:0;z-index:5;padding:10px 0 12px;
  background:rgba(13,12,16,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
/* one swipeable row: 8 tabs in a grid took a quarter of a phone screen */
.tabs .wrap{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{
  flex:1 0 58px;
  appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);
  border-radius:12px;padding:8px 6px 7px;font:inherit;cursor:pointer;text-align:center;line-height:1.3;
}
.tab .no{display:block;font-family:"Noto Serif TC",serif;font-weight:900;font-size:19px;color:var(--ink)}
.tab .d{display:block;font-size:12px;color:var(--dim);white-space:nowrap}
.tab[aria-selected="true"]{border-color:var(--c);background:linear-gradient(var(--cs),var(--cs)),var(--card)}
.tab[aria-selected="true"] .no{color:var(--c)}

/* ---------- workshop section ---------- */
.ws-head{padding:26px 0 6px}
.ws-head .date{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--acc);letter-spacing:.1em}
.ws-head h2{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(22px,5.6vw,30px);line-height:1.35;margin-top:4px}
.ws-head p{color:var(--dim);font-size:14px;margin-top:6px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:16px 0;overflow:hidden}
.card header{display:flex;align-items:center;gap:10px;padding:14px 14px 10px 16px}
.pid{
  flex:none;font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:600;letter-spacing:.06em;
  color:var(--bg);background:var(--acc);padding:3px 8px;border-radius:6px;
}
.card h3{flex:1;font-size:18px;font-weight:700;line-height:1.35}
.copy{
  flex:none;appearance:none;border:0;border-radius:10px;padding:9px 14px;min-height:40px;
  background:var(--acc);color:var(--bg);font:inherit;font-size:15px;font-weight:700;cursor:pointer;
}
.copy.done{background:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;padding:0 16px 12px;border-bottom:1px solid var(--line)}
.tag{font-size:12px;padding:1px 9px;border-radius:99px;border:1px solid var(--acc);color:var(--acc);white-space:nowrap}
.hint{font-size:14px;color:var(--dim)}
.card pre{
  white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:15.5px;line-height:1.75;
  padding:14px 16px 18px;color:var(--ink);
}

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  max-width:calc(100% - 32px);padding:11px 18px;border-radius:12px;font-size:14px;
  background:var(--ink);color:var(--bg);opacity:0;pointer-events:none;transition:.25s;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.wb{display:inline-block;margin-top:14px;padding:9px 16px;border-radius:10px;background:var(--acc);color:var(--bg);font-size:15px;font-weight:700;text-decoration:none}
.credit{padding-top:28px;padding-bottom:calc(32px + env(safe-area-inset-bottom));text-align:right;font-size:12px;color:var(--dim)}

@media (min-width:700px){
  .card header{padding:18px 18px 12px 22px}
  .meta{padding:0 22px 14px}
  .card pre{font-size:16.5px;padding:18px 22px 22px}
}
</style>
</head>
<body>
<header class="top wrap">
  <p class="eyebrow">商業發展研究院・OPC 一人公司 AI 實戰</p>
  <h1>學員<em>提示詞</em>手冊</h1>
  <ol class="how">
    <li><span>按<b>「複製」</b></span></li>
    <li><span>看卡片標籤貼到對的地方：<b>Claude Code</b> 貼進 Claude Code；<b>HoloTeam</b> 貼進 HoloTeam；<b>任何 AI 聊天</b> 貼到 ChatGPT、Gemini、Claude 都可以；<b>兩者皆可</b> 貼到你走的那一軌</span></li>
    <li><span>把 <span class="ph">【】</span> 連同括號換成你的內容，再送出</span></li>
    <li><span>標「接續上一步」的，在同一個對話裡接著貼</span></li>
    <li><span>真實客戶的姓名、電話、統編先換成代號，再貼給 AI</span></li>
  </ol>
  <a class="wb" href="https://nice923boss.github.io/opc-pain-to-tool-workshop/" target="_blank" rel="noopener">打開痛點到工具工作台</a>
</header>

<nav class="tabs" aria-label="選擇單元"><div class="wrap" id="tabs" role="tablist"></div></nav>
<main class="wrap" id="list"></main>
<footer class="credit wrap">製作者：黃政文</footer>
<div class="toast" id="toast" role="status"></div>

<script>
/* All student prompts for Day 1 (W1 to W4) and Day 2 (W5 to W8). 【】 marks what students replace. */
window.PROMPTS = {};
[
  // ================= Day 1 Part I 看見 =================
  {
    id: "W1-P1", title: "痛點提案單", tag: "任何 AI 聊天",
    hint: "AI 一次問 2 題，用自己的話答，越具體越好",
    text: `請你扮演很會傾聽的經營顧問，訪談我這個一人公司，幫我寫一張「痛點提案單」。

我做的是：【你的行業與服務，例如：台南兩間房的民宿】

規則：
1. 一次最多問我 2 題，等我回答完再問下一輪，共 3 輪。
2. 從「一週做哪些事、哪件最花時間、哪件最煩」切入。
3. 不要推薦任何工具或方案，也不要替我回答。
4. 問完整理成五行提案單，不寫任何客戶名：
   ① 我的生意一句話
   ② 最卡的一件事（動詞開頭）
   ③ 多久一次、每次多久
   ④ 做錯或沒做會怎樣
   ⑤ 我生病三天，這件事會怎樣

準備好就問第一輪。`,
  },
  {
    id: "W1-P2", title: "套進三原型", tag: "任何 AI 聊天",
    hint: "AI 只給建議，要選哪一型由你決定",
    text: `我是一人公司，想用 AI 幫自己做一個小工具。以下是我最卡的事：
【貼上 W1-P1 的提案單，或用一句話寫最卡的事】

一人公司自己做的 AI 工具，大致分三型：
A 門面型：讓客人自己看懂、自己查（例如：可自己改內容的網站、FAQ）
B 流程型：把固定流程接起來（例如：AI 先訪談客人，整理成需求單）
C 產出型：把重複做的成品變快（例如：報價單、文案、動畫）

請完成：
1. 這件事最適合哪一型？說明理由。第二適合的是哪一型？
2. 各舉一個「做成工具後長什麼樣子」的畫面，用一段話描述。
3. 這件事裡，哪些步驟一定要留給我自己判斷？
4. 先不要替我決定，最後反問我 1 個問題，幫我選。`,
  },

  // ================= Day 1 Part II 構思 =================
  {
    id: "W2-P0", title: "爛提示詞對照", tag: "示範用",
    hint: "講師示範：看 AI 拿到一句模糊的話，會怎麼猜",
    text: `幫我做一個 AI 工具，讓我的生意變好。`,
  },
  {
    id: "W2-P1", title: "用三問選痛點", tag: "任何 AI 聊天",
    hint: "分數只是參考，選哪一個是你決定",
    text: `我想挑一件事做成自己的 AI 小工具。以下是我的候選清單：
【列出 2～4 件你常做又很煩的事，一行一件】

請用三個問題幫每件事評分（1～5 分），做成表格：
(1) 多常發生？（每天 5 分，每年一次 1 分）
(2) 每次花多久？（越久分數越高）
(3) 規則講得清楚嗎？（能寫成「如果…就…」5 分，全靠感覺 1 分）

然後：
1. 標出總分最高的一件，說明理由。
2. 如果有「需要判斷、一年一次、牽涉對客人的承諾、含個資要上傳」的情況，特別標出來並提醒我。
3. 先不要替我決定，最後問我：你想先做哪一件？`,
  },
  {
    id: "W2-P2", title: "自己寫建議單", tag: "接續上一步",
    hint: "接在 W2-P1 同一個對話裡用",
    text: `我選了這一件：【你選的那件事】
請當我的經營顧問，用「評估五問」幫我判斷，先不要替我定案：
1. 一個月花幾小時？列出頻率乘時長的算式。
2. 規則講得清楚嗎？公式、範本做得到的，先不用 AI。
3. 有沒有碰到先別做的四種：需要判斷、一年一次、對客人的承諾、含個資？
4. 屬於哪一型（A 門面、B 流程、C 產出）？工具階梯四階（SKILL、單檔工具、有後台的系統、平台產品），第一版停在哪一階？
5. 怎麼算成功？用經營數字講：每月省幾小時、少出幾次錯。

最後整理成「建議單」五欄：
工具型態｜第一版只做 3 件事｜這次先不做｜驗收一句話｜軌道（Claude Code、HoloTeam、聊天平台就夠）
沒把握的標［待確認］，最後反問我 2 個問題。`,
  },
  {
    id: "W2-P3", title: "AI 訪談寫規格", tag: "接續上一步",
    hint: "一次一題，答不出來的就說「還不確定」",
    text: `請訪談我，一起把這個小工具的一頁規格書寫出來。

我的建議單：【貼上 W2-P2 的建議單五欄】

規則：
1. 一次只問我 1 題，照七欄依序問：
   名稱、誰用、輸入、輸出、規則、不做什麼、驗收
2. 「不做什麼」和「驗收」先照建議單寫，再問我要不要改。
3. 我的回答太模糊時，舉兩個具體例子讓我選。
4. 不要替我填答案；我說「還不確定」就寫［待確認］。
5. 七欄問完，整理成一頁表格版規格書。
6. 附上 3 筆「假的但像真的」樣本資料，不用真實姓名與電話。`,
  },
  {
    id: "W2-P4", title: "規格書健檢", tag: "接續上一步",
    hint: "AI 挑毛病，改不改由你決定",
    text: `請用挑剔的眼光，健檢上面這份規格書，但先不要幫我改寫。

請逐條列出：
1. 模糊處：哪些字眼 AI 看了會猜（例如「好看」「方便」「快速」）？建議改成可以量的說法。
2. 交給 AI 決定的地方：哪些規則我沒講清楚，AI 動手時只能自己決定？
3. 個資與機密風險：哪些欄位含客人姓名、電話、身分證、帳號，或公司機密？建議怎麼去識別化。
4. 驗收標準能不能實際測？不能測的，改寫成「輸入什麼，應該看到什麼」。
5. 給這份規格書一個 1～10 分，說明扣分最多的地方。`,
  },

  // ================= Day 1 Part III 動手 =================
  {
    id: "W3-P1", title: "先規劃，不動手", tag: "Claude Code",
    hint: "Code 分頁選一個新的空資料夾再貼",
    text: `我想在這個資料夾裡做一個小工具，請先規劃，還不要寫任何檔案。

我的規格書：
【貼上 W2-P3 的規格書，或報價試算器的規格】

請告訴我：
1. 你打算做幾個檔案？每個檔案做什麼？
2. 畫面長什麼樣子？用條列描述由上到下有哪些區塊。
3. 規格書裡有哪些地方不清楚，需要我先決定？
4. 做完後，我要怎麼打開來看？

等我說「可以開始」才動手。`,
  },
  {
    id: "W3-P2", title: "做出報價試算器", tag: "Claude Code",
    hint: "看到權限提示，先讀它要做什麼再按允許",
    text: `可以開始。請做一個報價試算器，存成一個 HTML 檔：quote.html。

我的服務：【例如：民宿房型，或你的服務項目】
價格規則：
【例如：雙人房平日 2,800、假日 3,200；加床每晚 600；連住 3 晚以上打 9 折】

需求：
1. 輸入：【例如：房型、入住日期、晚數、人數、是否加床】
2. 輸出：明細（每一項怎麼算）與總價，金額加千分位。
3. 只用一個 HTML 檔，不要連網路、不要安裝任何東西。
4. 字要大、按鈕要大，繁體中文介面。

做完後：
1. 用規格書的樣本資料自己試算 3 筆，列出結果讓我核對。
2. 告訴我怎麼打開這個檔案。`,
  },
  {
    id: "W3-P2H", title: "試算器分兩步", tag: "HoloTeam",
    hint: "先做第一步，確認算對再貼第二步",
    text: `第一步：只做計算，先不做畫面。
我的服務：【例如：民宿房型】
價格規則：【例如：雙人房平日 2,800、假日 3,200；加床每晚 600；連住 3 晚以上打 9 折】

請先用條列寫出計算步驟，再用這 3 筆樣本資料算給我看：
【貼上 3 筆樣本資料】
先不要寫任何檔案，等我確認算法正確。

────（第一步確認正確後，再貼下面這段）────

第二步：做成網頁。
算法正確。請把它做成一個 HTML 檔 quote.html，存在工作區裡：
輸入欄位照上面的規則，輸出明細與總價，金額加千分位，字和按鈕都要大，繁體中文。
只用一個檔案，不要連網路。做完告訴我檔案在哪裡。`,
  },
  {
    id: "W3-P3", title: "回報句型修一輪", tag: "兩者皆可",
    hint: "一次只回報一個問題，修好再回報下一個",
    text: `我實際試用了 quote.html，發現一個問題：

我做了什麼：【例如：選雙人房、住 3 晚、加床】
我看到什麼：【例如：總價顯示 NaN】
我預期什麼：【例如：應該是 (2,800×3＋600×3)×0.9＝9,180】

請先說明你認為問題出在哪裡，再修改。
修完後，用同一組資料再算一次給我看，並告訴我還有沒有可能出錯的類似情況。`,
  },
  {
    id: "W3-P4", title: "手機版加複製", tag: "兩者皆可",
    hint: "做完用手機打開檔案，或用瀏覽器縮窄視窗檢查",
    text: `請幫 quote.html 加兩件事，其他地方不要動：

1. 手機版：螢幕寬度 375px 時，欄位與按鈕一欄排下來，不需要左右捲動。
2. 一鍵複製：總價下方加一個「複製報價文字」按鈕，複製成可以直接貼到 LINE 的文字，格式如下：
【寫你想給客人看的格式，例如：
您好，以下是報價：
雙人房 3 晚：8,400
加床 3 晚：1,800
連住折扣：-1,020
合計：9,180 元】

做完後列出你改了哪些地方，並告訴我怎麼在電腦上模擬手機畫面檢查。`,
  },

  // ================= Day 1 Part IV 交付 =================
  {
    id: "W4-P1", title: "列案例實際跑", tag: "兩者皆可",
    hint: "AI 列案例，你自己一筆一筆按，結果要你親眼看",
    text: `我的工具：【工具名稱，例如：報價試算器 quote.html】
它的規則：【貼上規格書的規則欄】

請幫我列 8 個測試案例，做成表格：
編號｜輸入｜預期結果｜為什麼要測這個

其中要包含：
1. 一般情況 3 個
2. 邊界情況 3 個（例如：0 晚、剛好 3 晚、最多人數）
3. 亂填情況 2 個（例如：空白、負數、文字）

先不要改任何檔案。我會自己一筆一筆實際跑，再把結果告訴你。`,
  },
  {
    id: "W4-P2", title: "寫落差清單", tag: "兩者皆可",
    hint: "寫下來不是丟臉，是對自己和客人的交代",
    text: `我的工具：【工具名稱】
測試結果：【貼上 W4-P1 實際跑的結果，哪幾筆沒過】
我知道還沒做的事：【例如：還不能存檔、沒有手機版、假日判斷要手動選】

請幫我整理一份「落差清單」，做成表格：
編號｜項目｜原因｜影響（使用者會遇到什麼）｜什麼時候補｜誰負責

規則：

    { key: "W7", day: 2, no: "III", date: "13:30", start: "13:30", color: "#ffd166", title: "真實測試：拿上週真的 3 件事來測", sub: "情境測試、護欄攻擊測試，寫下落差清單。" },

  const DAY = { 1: "第一天", 2: "第二天" };

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("on"), 2200);
  }

  function copyText(text, btn) {
    const done = () => {
      btn.classList.add("done");
      btn.textContent = "已複製 ✓";
      setTimeout(() => { btn.classList.remove("done"); btn.textContent = "複製"; }, 1500);
      toast("已複製，貼到 AI 平台後把【】換成你的內容");
    };
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.readOnly = true;
      ta.style.cssText = "position:fixed;top:0;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy");
      ta.remove();
      ok ? done() : toast("複製失敗，請長按文字手動複製");
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  function show(key) {
    const ws = WORKSHOPS.find((w) => w.key === key) || WORKSHOPS[0];
    document.documentElement.style.setProperty("--acc", ws.color);
    document.documentElement.style.setProperty("--hl", ws.color + "24");
    tabsEl.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.key === ws.key)));
    // keep the selected tab visible in the swipeable row (opening a late #hash starts it off-screen)
    const sel = tabsEl.querySelector('[aria-selected="true"]').getBoundingClientRect();
    tabsEl.scrollLeft += sel.left - tabsEl.getBoundingClientRect().left - (tabsEl.clientWidth - sel.width) / 2;
    try { localStorage.setItem("opc_hb_day", String(ws.day)); } catch (e) { /* private mode: fall back to day 1 */ }

        <p class="date">${DAY[ws.day]} ${ws.no} ・ ${ws.date} 開始</p>
        <h2>${esc(ws.title)}</h2>
        <p>${esc(ws.sub)}</p>
      </section>
      ${items.map((p) => `
      <article class="card" id="${p.id}">
        <header><span class="pid">${esc(p.id)}</span><h3>${esc(p.title)}</h3>
          <button class="copy" data-id="${p.id}">複製</button></header>
        <div class="meta">${p.tag ? `<span class="tag">${esc(p.tag)}</span>` : ""}<span class="hint">${esc(p.hint || "")}</span></div>
        <pre>${highlight(p.text)}</pre>
      </article>`).join("")}`;
    history.replaceState(null, "", "#" + ws.key);
  }

  tabsEl.innerHTML = WORKSHOPS.map((w) => `
    <button class="tab" role="tab" data-key="${w.key}" style="--c:${w.color};--cs:${w.color}2e">
      <span class="no">${w.no}</span><span class="d">${DAY[w.day]} ${w.date}</span></button>`).join("");
  tabsEl.addEventListener("click", (e) => {
    const t = e.target.closest(".tab");
    if (!t) return;
    show(t.dataset.key);
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  listEl.addEventListener("click", (e) => {
    const b = e.target.closest(".copy");
    if (b) copyText(window.PROMPTS[b.dataset.id].text, b);
  });

  // Open the tab from the URL hash; otherwise the latest module started by now (local time) on the day last viewed.
  // The course has no fixed dates, so day 2 relies on a #W5 link or the remembered day.
  const fromHash = location.hash.slice(1).split("-")[0];
  const now = new Date().toTimeString().slice(0, 5);
  let day = 1;
  try { day = Number(localStorage.getItem("opc_hb_day")) || 1; } catch (e) { /* private mode: day 1 */ }
  const ofDay = WORKSHOPS.filter((w) => w.day === day);
  const byDate = [...ofDay].reverse().find((w) => now >= w.start) || ofDay[0];
  show(WORKSHOPS.some((w) => w.key === fromHash) ? fromHash : byDate.key);
})();
</script>
</body>
</html>
