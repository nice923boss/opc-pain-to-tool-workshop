/* ---------------- 動效（GSAP／rough-notation／canvas-confetti；CDN 未載入或偏好減少動態時略過） ---------------- */
let _fxKey='',_ann=[];
const fxReduced=()=>typeof matchMedia==='function'&&!!matchMedia('(prefers-reduced-motion: reduce)').matches;
function fxEnter(key,sel){const same=key===_fxKey;_fxKey=key;if(same||typeof gsap==='undefined'||fxReduced())return;
  try{gsap.from(sel||'#view > *',{y:14,opacity:0,duration:.35,stagger:.05,ease:'power2.out',clearProps:'transform,opacity'});}catch(e){console.warn('GSAP 進場動畫失敗',e);}}
/* 截圖前把進行中的進場動畫跑到終點，避免 PDF 截到半透明內容 */
function fxFinish(){if(typeof gsap==='undefined')return;
  try{gsap.getTweensOf('#view, #view *').forEach(t=>t.progress(1));}catch(e){console.warn('結束進場動畫失敗',e);}}
if(typeof addEventListener==='function')addEventListener('beforeprint',fxFinish);
/* 讀 THEME 色票（CSS 變數）；Canvas、p5、rough.js、html2canvas 背景色這類不能直接用 var() 的地方取實際色碼 */
function tok(name,fb){try{const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();return v||fb;}catch(e){return fb;}}
function fxAnnotate(){_ann.forEach(a=>{try{a.remove();}catch(e){console.warn('移除手繪標註失敗',e);}});_ann=[];
  if(typeof RoughNotation==='undefined'||fxReduced())return;
  try{const A=RoughNotation.annotate,h=document.querySelector('#view .stage-hero h1'),r=document.querySelector('#view .tabpanel.active .ring');
    if(h)_ann.push(A(h,{type:'underline',color:tok('--red','#c8553d'),strokeWidth:2,padding:2,iterations:1}));
    if(r)_ann.push(A(r,{type:'circle',color:tok('--yellow','#d9a23a'),strokeWidth:2,padding:6}));
    _ann.forEach(a=>a.show());}catch(e){console.warn('rough-notation 標註失敗',e);}}
function fxConfetti(big){if(typeof confetti!=='function'||fxReduced())return;
  try{const colors=[['--red','#c8553d'],['--yellow','#d9a23a'],['--green','#4f7d5c'],['--blue','#2f5d73'],['--ink','#2b2622']].map(c=>tok(c[0],c[1]));
    if(big){confetti({particleCount:160,spread:100,origin:{y:.6},colors});
      setTimeout(()=>confetti({particleCount:90,angle:60,spread:70,origin:{x:0,y:.7},colors}),250);
      setTimeout(()=>confetti({particleCount:90,angle:120,spread:70,origin:{x:1,y:.7},colors}),400);}
    else confetti({particleCount:60,spread:60,origin:{y:.7},colors,scalar:.9});}catch(e){console.warn('confetti 失敗',e);}}

/* ---------------- PDF（html2canvas 截圖 → jsPDF 分頁，A4 直式） ---------------- */
let _pdfBusy=false;
function pdfName(){const nm=String((S.d(1)||{}).name||'').replace(/[\\/:*?"<>|\s]/g,'');return`${UI.pdfPrefix}_${nm||'未填姓名'}_${new Date().toLocaleDateString('sv-SE')}.pdf`;}
async function makePDF(){if(typeof html2canvas!=='function'||!window.jspdf)throw new Error('PDF 元件尚未載入（需要網路）');
  const docEl=document.getElementById('reportDoc');if(!docEl)throw new Error(`找不到報告內容，請先開啟${UI.reportName}頁`);
  fxFinish();document.body.classList.add('pdf-mode');
  try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;window.scrollTo(0,0);
    let marks=null;
    const canvas=await html2canvas(docEl,{scale:1.5,logging:false,backgroundColor:tok('--pdf-bg','#fffdf7'),useCORS:true,windowWidth:1280,
      ignoreElements:el=>!!(el.classList&&(el.classList.contains('no-print')||el.classList.contains('rough-annotation'))),
      onclone:cd=>{const c=cd.getElementById('reportDoc');
        /* html2canvas 會把畫面上 SVG 的計算尺寸寫死成 inline style；畫面寬度與 1280 不同時會撐破版面，移除後交回 CSS 計算 */
        c.querySelectorAll('svg').forEach(s=>['width','height','inline-size','block-size','transform-origin','perspective-origin'].forEach(k=>s.style.removeProperty(k)));
        const box=c.getBoundingClientRect();const rel=el=>el.getBoundingClientRect().top-box.top;
        marks={w:box.width,force:[...c.querySelectorAll('.page-break')].map(rel),
          cand:[...c.querySelectorAll('.report-section>*,.form-section,.field,tr,li,.dx-item,.kpi,.skbox')].map(rel)};}});
    const W=canvas.width,Ht=canvas.height,k=marks&&marks.w?W/marks.w:1.5,pageH=Math.floor(W*277/190);
    const force=(marks?marks.force:[]).map(v=>Math.round(v*k)).sort((a,b)=>a-b);
    const cand=(marks?marks.cand:[]).map(v=>Math.round(v*k)).sort((a,b)=>a-b);
    /* 斷頁：範圍內有強制分頁就用；否則取超過 4 成頁高後最後一個區塊起點；都沒有才硬切 */
    const cuts=[0];let y=0;
    while(y<Ht-4){const lim=y+pageH;const f=force.find(v=>v>y+20&&v<=lim&&v<Ht-20);let nx;
      if(f!=null)nx=f;else if(lim>=Ht)nx=Ht;else{const c=cand.filter(v=>v>y+pageH*.4&&v<=lim);nx=c.length?c[c.length-1]:lim;}
      cuts.push(nx);y=nx;}
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});const n=cuts.length-1;
    for(let i=0;i<n;i++){const sy=cuts[i],sh=cuts[i+1]-sy;const pc=document.createElement('canvas');pc.width=W;pc.height=sh;
      const g=pc.getContext('2d');g.fillStyle=tok('--pdf-bg','#fffdf7');g.fillRect(0,0,W,sh);g.drawImage(canvas,0,sy,W,sh,0,0,W,sh);
      if(i)pdf.addPage();pdf.addImage(pc.toDataURL('image/jpeg',.85),'JPEG',10,10,190,sh*190/W);
      pdf.setFontSize(9);pdf.setTextColor(120);pdf.text(`${i+1} / ${n}`,200,292,{align:'right'});}
    return pdf;
  }finally{document.body.classList.remove('pdf-mode');}}
async function savePDF(){if(_pdfBusy)return toast('PDF 產生中，請稍候');_pdfBusy=true;toast('正在產生 PDF，約需 5～15 秒…');
  try{const pdf=await makePDF();pdf.save(pdfName());toast('PDF 已下載：'+pdfName());}
  catch(e){console.error('PDF 產生失敗',e);toast('PDF 產生失敗：'+e.message,true);}
  finally{_pdfBusy=false;}}

/* ---------------- 寄送報告（Google Apps Script 轉寄；MAIL.endpoint 空白 = 尚未設定） ---------------- */
function sendPlan(){const d=S.d(1)||{};const name=String(d.name||'').trim(),email=String(d.email||'').trim();
  if(!MAIL.endpoint)return toast(`寄信尚未設定，請先下載 PDF 再交給${MAIL.toLabel}`,true);
  if(!name)return toast('請先完成第 1 階段（姓名會當作信件主旨）',true);
  const n=doneCount();
  modal(`<h3>寄給${esc(MAIL.toLabel)}</h3><dl class="meta"><dt>信件主旨</dt><dd>${esc(name)}</dd><dt>你的 Email</dt><dd>${esc(email||'（未填）')}</dd><dt>完成階段</dt><dd>${n} / ${N_STAGES}</dd></dl>${n<N_STAGES?`<div class="note warn mt12">還有 ${N_STAGES-n} 個階段沒完成，寄出的是部分報告。建議全部完成再寄。</div>`:''}<p class="small muted mt12">信件會附上這份報告的 PDF；${esc(MAIL.toLabel)}可以直接回信到你的 Email。</p><div class="btn-row mt12"><button class="btn primary" id="sendGo" onclick="doSendPlan()">確認寄出</button><button class="btn" onclick="closeModal()">取消</button></div>`);}
async function doSendPlan(){if(_pdfBusy)return;_pdfBusy=true;const btn=document.getElementById('sendGo');if(btn){btn.disabled=true;btn.textContent='寄送中…';}
  const d=S.d(1)||{};const name=String(d.name||'').trim(),email=String(d.email||'').trim();
  try{const pdf=await makePDF();const b64=pdf.output('datauristring').split(',')[1];
    const res=await fetch(MAIL.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({name,email,subject:name,filename:pdfName(),pdf:b64,done:doneCount(),total:N_STAGES})});
    let j;try{j=await res.json();}catch(e){throw new Error('伺服器回應格式錯誤（HTTP '+res.status+'）');}
    if(!res.ok||!j.ok)throw new Error(j.error||('HTTP '+res.status));
    closeModal();toast(`已寄出，${MAIL.toLabel}會收到你的${UI.reportName}`);}
  catch(e){console.error('寄送失敗',e);toast('寄送失敗：'+e.message+'。請改用下載 PDF',true);if(btn){btn.disabled=false;btn.textContent='確認寄出';}}
  finally{_pdfBusy=false;}}

/* ---------------- 開場說明（p5.js instance mode，無音效；第一次造訪自動播放） ---------------- */
const INTRO_MS=7500;let _introI=0,_introP5=null,_introT=null,_introStart=0;
const introSeenKey=()=>APP.storageKey+'_intro';
function introMaybe(){const b=id=>document.getElementById(id);
  b('introPrev').onclick=()=>introGo(_introI-1);
  b('introNext').onclick=()=>_introI>=INTRO.length-1?introClose():introGo(_introI+1);
  b('introSkip').onclick=introClose;
  b('introDots').innerHTML=INTRO.map((x,i)=>`<i title="${i+1}. ${esc(x.t)}" onclick="introGo(${i})"></i>`).join('');
  document.addEventListener('keydown',e=>{if(!b('intro').classList.contains('show'))return;
    if(e.key==='Escape')introClose();else if(e.key==='ArrowRight')b('introNext').click();else if(e.key==='ArrowLeft')introGo(_introI-1);});
  let seen=false;try{seen=localStorage.getItem(introSeenKey())==='1';}catch(e){console.warn('無法讀取開場說明紀錄',e);}
  if(!seen)introOpen(0);}
function introOpen(i){const el=document.getElementById('intro');el.classList.add('show');document.body.style.overflow='hidden';introGo(i||0);introStartSketch();}
function introStartSketch(){const el=document.getElementById('intro');if(_introP5||!el.classList.contains('show'))return;
  if(fxReduced()){el.classList.add('no-p5');return;}
  if(typeof p5==='undefined'){if(document.readyState!=='complete'){window.addEventListener('load',introStartSketch,{once:true});return;}
    console.warn('p5.js 未載入，開場說明改為純文字');el.classList.add('no-p5');return;}
  el.classList.remove('no-p5');
  try{_introP5=new p5(introSketch,document.getElementById('introStage'));}catch(e){console.warn('p5 開場動畫啟動失敗',e);el.classList.add('no-p5');}}
function introGo(i){if(i<0||i>=INTRO.length)return;_introI=i;const x=INTRO[i],b=id=>document.getElementById(id),last=i===INTRO.length-1;
  b('introNo').textContent=String(i+1).padStart(2,'0')+' / '+String(INTRO.length).padStart(2,'0');
  b('introT').textContent=x.t;b('introS').textContent=x.s;
  b('introNext').textContent=last?'開始填寫':'下一段';b('introPrev').disabled=i===0;
  [...b('introDots').children].forEach((d,k)=>{d.className='';void d.offsetWidth;d.className=k<i?'done':k===i?'on'+(last?' hold':''):'';});
  _introStart=performance.now();clearTimeout(_introT);
  if(!last&&!fxReduced())_introT=setTimeout(()=>introGo(_introI+1),INTRO_MS);}
function introClose(){clearTimeout(_introT);document.getElementById('intro').classList.remove('show');document.body.style.overflow='';
  try{localStorage.setItem(introSeenKey(),'1');}catch(e){console.warn('無法記錄開場說明已看過',e);}
  if(_introP5){_introP5.remove();_introP5=null;}}

/* 手寫字型依 unicode-range 分片下載；先把開場畫面會用到的字送進 fonts.load，第一幕才不會閃備用字型 */
function introGlyphs(){const fixed='方法說明為什麼要做操作指引怎麼填參考範例別人先看三張卡再動手規則扣分看得到原因主旨：你的姓名';
  const s=JSON.stringify([INTRO,UI.slate,UI.reportName,APP.platform,STAGES.map(x=>x.title),THEME.labels])+(THEME.glyphs||'')+fixed;
  return[...new Set([...s].filter(c=>c.charCodeAt(0)>127))].join('');}
/* 手繪風場景：設計座標 800×380，等比縮放置中；線條每 4 格重抖一次（line boil）。
   顏色與字型讀 THEME 色票；title、strip 等主題場景由 THEME.intro.scenes 提供，同名時覆寫下方通用場景 */
function introSketch(p){const INK=tok('--ink','#2b2622'),RED=tok('--red','#c8553d'),YEL=tok('--yellow','#d9a23a'),GRN=tok('--green','#4f7d5c'),BLU=tok('--blue','#2f5d73'),GRAY=tok('--muted-2','#a3968a'),CARD=tok('--card','#fffcf5'),BG=tok('--paper','#f3ead8'),LINE=tok('--line','#d8ccb6');
  const fam=v=>String(v||'').split(',')[0].trim().replace(/^["']|["']$/g,''),HAND=fam(tok('--hand'))||'LXGW WenKai TC',TYPE=fam(tok('--type'))||"Special Elite";
  const host=()=>document.getElementById('introStage');let W=10,H=10;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),seg=(t,a,b)=>clamp((t-a)/(b-a),0,1),ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
  const boil=()=>Math.floor(p.frameCount/4);
  /* wobbly line drawn up to fraction k */
  const wl=(x1,y1,x2,y2,sd,k)=>{k=k==null?1:k;if(k<=0)return;p.noFill();const n=Math.max(2,Math.ceil(p.dist(x1,y1,x2,y2)/14));p.beginShape();
    for(let i=0;i<=n;i++){const u=i/n*k;const jx=(p.noise(sd+i*.37,boil()*1.7)-.5)*3,jy=(p.noise(sd+40+i*.37,boil()*1.7)-.5)*3;p.vertex(p.lerp(x1,x2,u)+jx,p.lerp(y1,y2,u)+jy);}p.endShape();};
  const wr=(x,y,w,h,sd,k,fc)=>{k=k==null?1:k;if(fc&&k>.9){p.push();p.noStroke();p.fill(fc);p.rect(x,y,w,h);p.pop();}const e=[[x,y,x+w,y],[x+w,y,x+w,y+h],[x+w,y+h,x,y+h],[x,y+h,x,y]];e.forEach((s,i)=>wl(s[0],s[1],s[2],s[3],sd+i*9,clamp(k*4-i,0,1)));};
  const wc=(cx,cy,rx,ry,sd,k)=>{k=k==null?1:k;if(k<=0)return;p.noFill();const n=40;p.beginShape();for(let i=0;i<=n*k;i++){const a=i/n*p.TWO_PI-p.HALF_PI;const j=(p.noise(sd+i*.3,boil()*1.7)-.5)*4;p.vertex(cx+(rx+j)*Math.cos(a),cy+(ry+j)*Math.sin(a));}p.endShape();};
  const hatch=(x,y,w,h,col,sd)=>{p.push();p.stroke(col);p.strokeWeight(1.4);for(let d=6;d<w+h;d+=7){const x1=x+Math.max(0,d-h),y1=y+Math.min(h,d),x2=x+Math.min(w,d),y2=y+Math.max(0,d-w);wl(x1,y1,x2,y2,sd+d,1);}p.pop();};
  const check=(x,y,s,col,k,sd)=>{p.push();p.stroke(col);p.strokeWeight(3.2);wl(x,y,x+s*.35,y+s*.4,sd,seg(k,0,.4));wl(x+s*.35,y+s*.4,x+s,y-s*.45,sd+5,seg(k,.4,1));p.pop();};
  const txt=(s,x,y,sz,col,al,font)=>{p.push();p.noStroke();p.fill(col);p.textFont(font||HAND);p.textSize(sz);p.textAlign(al||p.LEFT,p.BASELINE);p.text(s,x,y);p.pop();};
  p.setup=()=>{W=host().clientWidth||10;H=host().clientHeight||10;p.createCanvas(W,H);p.frameRate(30);
    if(document.fonts&&document.fonts.load)document.fonts.load(`24px "${HAND}"`,introGlyphs()).catch(e=>console.warn('開場字型載入失敗，改用備用字型',e));};
  p.windowResized=()=>{W=host().clientWidth||10;H=host().clientHeight||10;p.resizeCanvas(W,H);};
  const base={
    cards:t=>{const u=ease(seg(t,.3,1.6)),L=[['方法說明','為什麼要做',RED],['操作指引','怎麼填',YEL],['參考範例','別人怎麼填',BLU]];
      L.forEach((c,i)=>{const tx=400+(i-1)*230*u,rot=(i-1)*.1*u;p.push();p.translate(tx,200);p.rotate(rot);
        wr(-95,-120,190,230,700+i*13,1,CARD);hatch(-93,-118,186,34,c[2],720+i*9);
        txt(c[0],0,-62,24,INK,p.CENTER);txt(c[1],0,-34,15,GRAY,p.CENTER);
        for(let r=0;r<4;r++)wl(-70,-6+r*24,-70+(r===3?80:140),-6+r*24,740+i*11+r,seg(t,1.7+i*.35+r*.12,2.1+i*.35+r*.12));
        p.pop();});
      txt('先看三張卡，再動手填',400,350,18,GRAY,p.CENTER);},
    write:(t,q)=>{const mine=q.mine||'',shown=mine.slice(0,Math.floor(seg(t,1,4.6)*mine.length));
      wr(150,60,500,270,800,ease(seg(t,0,.8)),CARD);
      p.push();p.stroke(LINE);p.strokeWeight(1.2);for(let r=0;r<4;r++)wl(170,140+r*44,630,140+r*44,820+r,seg(t,.3,1));p.pop();
      txt(q.label||'',172,98,16,RED);txt(shown,172,132,30,INK);
      p.push();p.textFont(HAND);p.textSize(30);const tw=p.textWidth(shown);p.pop();
      if(t<4.9){const px=172+tw+6,py=128;p.push();p.translate(px,py);p.rotate(-.75);wr(0,-7,70,14,850,1,YEL);p.fill(INK);p.noStroke();p.triangle(-14,0,0,-7,0,7);p.stroke(INK);wl(52,-7,52,7,860,1);p.pop();}
      txt(q.example||'',172,184,17,GRAY);
      if(t>4.9)check(560,112,28,GRN,seg(t,4.9,5.4),870);
      if(t>5.4)txt(q.moral||'',400,300,18,RED,p.CENTER);},
    check:(t,q)=>{const rows=(q.rows||[]).slice(0,4),bi=rows.findIndex(r=>r[1]==='bad');
      rows.forEach((r,i)=>{const y=100+i*56+(bi>=0&&i>bi?24:0),k0=.6+i*.8;wr(90,y-26,40,40,900+i,1,CARD);txt(r[0],150,y+2,21,INK);
        if(t>k0&&r[1]==='ok')check(98,y-4,24,GRN,seg(t,k0,k0+.35),910+i);
        if(t>k0&&r[1]==='bad'){p.push();p.stroke(RED);p.strokeWeight(3);wc(270,y-6,200,26,930,ease(seg(t,k0,k0+.6)));p.pop();if(t>k0+.6)txt(q.badNote||'',150,y+42,15,RED);}});
      const sc=Math.round((q.score||65)*ease(seg(t,.8,4.2))),a=p.PI+p.PI*sc/100;
      p.beginShape();for(let i=0;i<=30;i++){const g=p.PI+p.PI*i/30,j=(p.noise(960+i*.3,boil()*1.7)-.5)*3;p.vertex(620+(110+j)*Math.cos(g),250+(110+j)*Math.sin(g));}p.endShape();wl(500,250,740,250,965,1);
      p.push();p.stroke(RED);p.strokeWeight(4);wl(620,250,620+Math.cos(a)*90,250+Math.sin(a)*90,970,1);p.pop();
      txt(String(sc),620,300,40,INK,p.CENTER,TYPE);txt('規則扣分，看得到原因',620,330,15,GRAY,p.CENTER);},
    send:(t,q)=>{const u=ease(seg(t,1,4)),bx=(a,b,c,d,v)=>(1-v)**3*a+3*(1-v)**2*v*b+3*(1-v)*v*v*c+v**3*d;
      wr(110,110,130,170,1000,ease(seg(t,0,.7)),CARD);hatch(112,112,126,30,RED,1010);
      txt('PDF',175,138,20,INK,p.CENTER,TYPE);for(let r=0;r<5;r++)wl(130,170+r*20,220,170+r*20,1020+r,1);
      txt(q.doc||UI.reportName,175,305,15,GRAY,p.CENTER);
      const ex=560,ey=150,ew=170,eh=110,cl=seg(t,4.1,4.6);wr(ex,ey,ew,eh,1100,1,CARD);
      wl(ex,ey+eh,ex+ew/2,ey+eh*.45,1110,1);wl(ex+ew,ey+eh,ex+ew/2,ey+eh*.45,1115,1);
      const fy=p.lerp(ey-50,ey+eh*.55,cl);wl(ex,ey,ex+ew/2,fy,1120,1);wl(ex+ew,ey,ex+ew/2,fy,1125,1);
      txt('主旨：你的姓名',ex+ew/2,ey+eh+34,17,INK,p.CENTER);
      if(t>1&&cl<1){p.push();p.stroke(GRAY);p.strokeWeight(1.6);p.drawingContext.setLineDash([6,8]);p.noFill();p.beginShape();
        for(let v=0;v<=u;v+=.02)p.vertex(bx(240,330,470,600,v),bx(190,30,40,175,v));p.endShape();p.drawingContext.setLineDash([]);p.pop();
        const px=bx(240,330,470,600,u),py=bx(190,30,40,175,u),px2=bx(240,330,470,600,Math.min(1,u+.02)),py2=bx(190,30,40,175,Math.min(1,u+.02));
        p.push();p.translate(px,py);p.rotate(Math.atan2(py2-py,px2-px));p.fill(CARD);p.stroke(INK);p.strokeWeight(2.2);p.triangle(22,0,-16,-13,-8,0);p.triangle(22,0,-16,11,-8,0);p.pop();}
      if(cl>=1)check(ex+ew/2-14,ey+eh*.55,30,GRN,seg(t,4.6,5.1),1130);}};
  const K={p,wl,wr,wc,hatch,check,txt,seg,ease,clamp,boil,C:{INK,RED,YEL,GRN,BLU,GRAY,CARD,BG,LINE},F:{hand:HAND,type:TYPE}};
  const scenes={...base,...((THEME.intro||{}).scenes||{})};
  p.draw=()=>{p.background(BG);const t=(performance.now()-_introStart)/1000,sc=Math.min(W/800,H/380);
    p.push();p.translate((W-800*sc)/2,(H-380*sc)/2);p.scale(sc);p.noFill();p.stroke(INK);p.strokeWeight(2.4);p.strokeJoin(p.ROUND);p.strokeCap(p.ROUND);
    txt(String(THEME.labels.introCorner||'').replace('{n}',String(_introI+1).padStart(2,'0')),14,24,13,RED,p.LEFT,TYPE);
    const cur=INTRO[_introI]||{},f=scenes[cur.k];if(f)f(t,cur.p||{},K);p.pop();};}

/* ---------------- 啟動 ---------------- */
renderBrand();load();if(!location.hash&&STATE.view)location.hash=STATE.view;route();introMaybe();
</script>
